<div style="min-height:100vh; background:linear-gradient(160deg, #e8f0fe 0%, #d0e1f7 30%, #bdd4f0 55%, #dce8f8 100%); display:flex; align-items:center; justify-content:center; padding:1.5rem; position:relative; overflow:hidden; font-family:'Segoe UI', system-ui, -apple-system, sans-serif">

  <!-- Decorative geometric overlay -->
  <div style="position:absolute; top:-60px; right:-60px; width:300px; height:300px; border-radius:50%; background:radial-gradient(circle, rgba(0,48,135,0.06) 0%, transparent 70%); pointer-events:none"></div>
  <div style="position:absolute; bottom:-80px; left:-80px; width:400px; height:400px; border-radius:50%; background:radial-gradient(circle, rgba(0,48,135,0.04) 0%, transparent 70%); pointer-events:none"></div>
  
  <!-- Gold academic crest band -->
  <div style="position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg, #B8953A, #E6D5A0, #C8A04F, #E6D5A0, #B8953A); z-index:1"></div>

  <div style="width:100%; max-width:400px; position:relative; z-index:1">

    <!-- Institution crest / logo area -->
    <div style="text-align:center; margin-bottom:1.75rem">
      <div style="display:inline-flex; align-items:center; justify-content:center; width:100px; height:100px; border-radius:50%; background:#ffffff; box-shadow:0 8px 30px rgba(0,0,0,0.15), 0 0 0 4px rgba(200,160,79,0.35); margin-bottom:1.1rem">
        <img src="assets/stb-logo.png" style="height:56px; object-fit:contain" alt="STB">
      </div>
      <p style="color:#5a6a8a; font-size:12px; margin-top:6px; letter-spacing:0.12em; text-transform:uppercase; font-weight:600">Système de Gestion de Sécurité</p>
    </div>

    <!-- Form card -->
    <div style="background:#ffffff; border-radius:16px; padding:2.25rem 2.25rem 2rem;
      box-shadow:0 20px 50px rgba(0,0,0,0.12), 0 0 0 1px rgba(200,160,79,0.15);
      position:relative; overflow:hidden">

      <!-- Top accent bar inside card -->
      <div style="position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg, #003087, #C8A04F, #003087)"></div>

      <div style="text-align:center; margin-bottom:1.75rem">
        <h2 style="color:#1a2a4a; font-size:1.2rem; font-weight:700; margin:0; letter-spacing:0.01em">Bienvenue</h2>
        <p style="color:#6B7280; font-size:13px; margin:6px 0 0">Connectez-vous pour accéder au portail</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div style="margin-bottom:1.15rem">
          <label style="display:block; margin-bottom:6px; font-size:11px; font-weight:700; color:#374151; text-transform:uppercase; letter-spacing:0.08em">
            Adresse Email
          </label>
          <input formControlName="email" type="email" placeholder="prenom.nom@stb.com.tn"
            style="width:100%; padding:12px 14px; border:1.5px solid #D1D5DB; border-radius:10px; font-size:14px; color:#1f2937; background:#f9fafb; box-sizing:border-box; transition:border 0.2s; outline:none">
        </div>

        <div style="margin-bottom:1.5rem">
          <label style="display:block; margin-bottom:6px; font-size:11px; font-weight:700; color:#374151; text-transform:uppercase; letter-spacing:0.08em">
            Mot de Passe
          </label>
          <input formControlName="password" type="password" placeholder="••••••••"
            style="width:100%; padding:12px 14px; border:1.5px solid #D1D5DB; border-radius:10px; font-size:14px; color:#1f2937; background:#f9fafb; box-sizing:border-box; transition:border 0.2s; outline:none">
        </div>

        <div *ngIf="error"
          style="background:#FEF2F2; color:#991B1B; padding:10px 14px; border-radius:10px;
            font-size:13px; margin-bottom:1rem; border:1px solid #FECACA; display:flex; align-items:center; gap:8px">
          <span style="font-size:16px">⚠</span>
          {{ error }}
        </div>

        <button type="submit" [disabled]="loading"
          style="width:100%; padding:13px; background:linear-gradient(135deg, #003087, #00245e); color:white; border:none;
            border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; letter-spacing:0.04em;
            box-shadow:0 4px 14px rgba(0,48,135,0.3); transition:all 0.2s"
          [style.opacity]="loading ? '0.7' : '1'">
          {{ loading ? 'Connexion en cours…' : 'Se Connecter' }}
        </button>
      </form>

      <div style="text-align:center; margin-top:1.75rem; color:#9CA3AF; font-size:10px; border-top:1px solid #E5E7EB; padding-top:1.15rem; letter-spacing:0.03em">
        <strong style="color:#6B7280">Société Tunisienne de Banque</strong> — Tous droits réservés © 2026
      </div>
    </div>
  </div>
</div>
